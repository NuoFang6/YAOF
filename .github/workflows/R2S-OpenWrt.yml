name: R2S-OpenWrt

on:
#  schedule:
#    - cron: 5 6 * * 0
  workflow_dispatch:
    inputs:
      upload_source:
        description: '是否在编译前打包并上传源码 (Upload compressed source before compile)'
        required: false
        default: 'true'
      build_firmware:
        description: '是否执行固件编译与发布 (Build firmware & release after archiving)'
        required: false
        default: 'false'
      include_dl:
        description: '源码归档是否包含 dl 源码缓存 (Include dl/ source cache in full archive)'
        required: false
        default: 'false'
  watch:
    types: started

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 512
        root-reserve-mb: 4608
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
    - name: Checkout
      uses: actions/checkout@main
    - name: Init build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo /bin/bash -c "$(curl -sL https://git.io/vokNn)"
        sudo -E apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang llvm file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl make patch perl-modules python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd
        sudo -E apt-fast -y -qq install dos2unix dwarves quilt npm jq
        sudo -E npm install -g pnpm
        pip3 install --user -U pylibfdt --break-system-packages
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo -E git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo -E git config --global core.abbrev auto
        df -h
    - name: Prepare Mixedwrt
      run: |
        sudo chown -R runner:runner /home/runner/work/YAOF
        cp -r ./SCRIPTS/R2S/. ./SCRIPTS/
        cp -r ./SCRIPTS/. ./
        /bin/bash 01_get_ready.sh
    - name: Prepare Package
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -r ../SCRIPTS/. ./
        /bin/bash 02_prepare_package.sh
        /bin/bash 02_target_only.sh
        /bin/bash 04_remove_upx.sh
    - name: QTMDFW4
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -rf ../SEED/R2S/config.seed .config
    - name: Convert Translation
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 03_convert_translation.sh
    - name: Add ACL
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 05_create_acl_for_luci.sh -a
    - name: Fix Permissions
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        sudo -E chmod -R 755 ./08_fix_permissions.sh
        /bin/bash 08_fix_permissions.sh
    - name: Make Config
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make defconfig
    - name: Get Architecture
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
        echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}-3328" >>$GITHUB_ENV
        latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][4-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
        echo "latest_release=${latest_release}" >>$GITHUB_ENV
    - name: Cache
      uses: HiGarfield/cachewrtbuild@main
      with:
        mixkey: ${{ env.TARGET_DEVICE_ARCH }}
        prefix: ${{ github.workspace }}/openwrt
    - name: Make Download
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make download -j50
    - name: Refresh nftables (prepare before full build)
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make -j$(($(nproc) + 1)) package/network/utils/nftables/refresh V=s

    - name: Prepare dl manifest
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true' }}
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        if [ -d dl ]; then
          echo "Generating dl manifest...";
          (cd dl; ls -1 > ../dl.MANIFEST.txt || true)
          echo "dl file count: $(wc -l < dl.MANIFEST.txt || echo 0)" >> dl.MANIFEST.txt
        fi
        cp dl.MANIFEST.txt .. 2>/dev/null || true
    - name: Archive Source (lite, exclude dl & build outputs)
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true' }}
      run: |
        echo "Packing LITE source (exclude build_dir, staging_dir, bin, tmp, dl, .git) with zstd -15 ..."
        tar \
          --exclude='./openwrt/bin' \
          --exclude='./openwrt/build_dir' \
          --exclude='./openwrt/staging_dir' \
          --exclude='./openwrt/tmp' \
          --exclude='./openwrt/dl' \
          -I 'zstd -15 -T0' -cf openwrt-source-lite.tar.zst ./openwrt || true
        ls -lh openwrt-source-lite.tar.zst
    - name: Upload Source Archive (lite)
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-source-lite
        path: |
          openwrt-source-lite.tar.zst
          dl.MANIFEST.txt
        retention-days: 7
    - name: Archive Source (full-with-dl)
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true') && inputs.include_dl == 'true' }}
      run: |
        echo "Packing FULL source (exclude build outputs but keep dl) with zstd -15 ..."
        tar \
          --exclude='./openwrt/bin' \
          --exclude='./openwrt/build_dir' \
          --exclude='./openwrt/staging_dir' \
          --exclude='./openwrt/tmp' \
          -I 'zstd -15 -T0' -cf openwrt-source-full-with-dl.tar.zst ./openwrt || true
        ls -lh openwrt-source-full-with-dl.tar.zst
    - name: Upload Source Archive (full-with-dl)
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true') && inputs.include_dl == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-source-full-with-dl
        path: openwrt-source-full-with-dl.tar.zst
        retention-days: 7
    - name: Cleanup Source Archives
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_source == 'true' }}
      run: |
        rm -f openwrt-source-lite.tar.zst openwrt-source-full-with-dl.tar.zst 2>/dev/null || true

    - name: Compile Openwrt (Full Build)
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware == 'true' }}
      working-directory: ${{ github.workspace }}/openwrt
      id: compileopenwrt
      continue-on-error: true
      run: |
        #echo | make kernel_oldconfig -j$(($(nproc) + 1))
        IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
        echo $?
    - name: If Error
      if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_firmware == 'true') && steps.compileopenwrt.outcome == 'failure' }}
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cat ./.config
        echo '================================================================'
        make -j1 V=s
    - name: Organize files
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware == 'true' }}
      id: organize
      run: |
        rm -rf ./artifact/
        mkdir -p ./artifact/
        mv openwrt/bin/targets/rockchip/armv8/*sysupgrade.img* ./artifact/
        cd ./artifact/
        ls -Ahl
        gzip -d *.gz && exit 0
        gzip --best *.img
        ls -Ahl
        sha256sum openwrt*r2s* | tee R2S-GC404-$(date +%Y-%m-%d)-${{ env.latest_release }}.sha256sum
        zip R2S-GC404-$(date +%Y-%m-%d)-${{ env.latest_release }}-ext4.zip *r2s*ext4*
        zip R2S-GC404-$(date +%Y-%m-%d)-${{ env.latest_release }}-sfs.zip *r2s*squashfs*
        ls -Ahl
    - name: Create release
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_firmware == 'true' }}
      id: create_release
      uses: ncipollo/release-action@main
      with:
        name: OpenWRT-${{ env.latest_release }}
        allowUpdates: true
        prerelease: false
        tag: ${{ env.latest_release }}
        commit: "24.10"
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ./artifact/*.zip
    - name: Print Disk Space After
      run: df -h
